<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 · 页面未找到</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f7f7fb; color: #1a1c2e; }
  .box { text-align: center; padding: 40px; }
  .code { font-size: 6rem; font-weight: 800; background: linear-gradient(135deg, #4f46e5, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0; }
  h1 { font-size: 1.4rem; margin: 8px 0 6px; }
  p { color: #6b7088; margin: 0 0 24px; }
  a { display: inline-block; padding: 12px 24px; border-radius: 12px; background: #4f46e5; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>这个页面走丢了</h1>
    <p>你访问的链接可能已移动或不存在。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
