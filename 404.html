<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 · 页面未找到</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; background: #131311; color: #d8d2c4; }
  .box { text-align: center; padding: 40px; }
  .code { font-size: 6rem; font-weight: 800; background: linear-gradient(180deg, #f2ede1, #c9bfa8); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0; }
  h1 { font-size: 1.4rem; margin: 8px 0 6px; }
  p { color: #9a948a; margin: 0 0 24px; }
  a { display: inline-block; padding: 12px 24px; border-radius: 999px; border: 1px solid rgba(184,155,110,0.4); color: #b89b6e; text-decoration: none; font-weight: 600; }
  a:hover { background: rgba(184,155,110,0.10); }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>这个页面走丢了</h1>
    <p>你访问的链接可能已移动或不存在。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
