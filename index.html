<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>知行旅人</title>
<meta name="description" content="知行旅人 —— 一段关于知与行的故事。" />
<style>
  :root {
    --bg: #f6f2e9;          /* 宣纸 / 羊皮纸暖白 */
    --bg-2: #ece5d6;
    --ink: #33302a;         /* 墨字 */
    --ink-soft: #6f695e;
    --glow: rgba(0,0,0,0);
    --accent: #8a6d3b;      /* 暖墨点缀 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(120% 90% at 50% 0%, #fbf8f1 0%, var(--bg) 55%, var(--bg-2) 100%);
    color: var(--ink);
    font-family: "Noto Serif SC", "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* faint film grain / vignette */
  body::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(130% 100% at 50% 50%, transparent 60%, rgba(80,68,52,0.10) 100%);
    z-index: 5;
  }

  /* ===== Gate ===== */
  #gate {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px; text-align: center; padding: 24px;
    background: radial-gradient(120% 80% at 50% 0%, #fbf8f1 0%, var(--bg) 60%);
    transition: opacity 1.1s ease, visibility 1.1s ease;
  }
  #gate.hidden { opacity: 0; visibility: hidden; }
  #gate .title {
    font-size: clamp(2.4rem, 8vw, 4.4rem);
    letter-spacing: 0.5em; text-indent: 0.5em;
    margin: 0; font-weight: 600;
    background: linear-gradient(180deg, #2c2a25 0%, #7a6f5c 120%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #gate .sub { color: var(--ink-soft); font-size: 0.95rem; letter-spacing: 0.18em; }
  #enter {
    margin-top: 8px; cursor: pointer; user-select: none;
    border: 1px solid rgba(138,109,59,0.40);
    color: var(--accent); background: transparent;
    padding: 14px 34px; border-radius: 999px;
    font-family: inherit; font-size: 1rem; letter-spacing: 0.3em; text-indent: 0.3em;
    transition: all 0.4s ease;
    animation: breathe 3.4s ease-in-out infinite;
  }
  #enter:hover { background: rgba(138,109,59,0.10); border-color: var(--accent); }
  .hint { color: #6f6a5e; font-size: 0.78rem; letter-spacing: 0.12em; margin-top: 4px; }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 rgba(138,109,59,0); } 50% { box-shadow: 0 0 22px 1px rgba(138,109,59,0.16); } }

  /* ===== Stage ===== */
  #stage { display: none; position: relative; z-index: 1; }
  #stage.show { display: block; }
  .story {
    max-width: 720px; margin: 0 auto;
    padding: 16vh 32px 26vh;
    font-size: clamp(1.15rem, 2.6vw, 1.5rem);
    line-height: 1.9; letter-spacing: 0.02em;
    min-height: 100vh;
    animation: fadeIn 1.4s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .story p { margin: 0 0 1em; color: var(--ink); }
  .story p.blank { height: 1.1em; }
  .cursor {
    display: inline-block; width: 0.55em; height: 1.05em;
    background: var(--ink); margin-left: 2px;
    transform: translateY(0.16em);
    animation: blink 1.05s step-end infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* controls */
  .controls {
    position: fixed; right: 18px; bottom: 18px; z-index: 10;
    display: flex; gap: 10px;
  }
  .controls button {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.12);
    background: rgba(255,255,255,0.55); color: var(--ink-soft);
    cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(6px);
    transition: all 0.25s ease;
  }
  .controls button:hover { color: var(--accent); border-color: rgba(138,109,59,0.55); }
  .the-end {
    position: fixed; left: 0; right: 0; bottom: 30px; z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    opacity: 0; transition: opacity 1.4s ease; pointer-events: none;
  }
  .the-end.show { opacity: 1; pointer-events: auto; }
  .gh-link {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-decoration: none; color: var(--accent); transition: transform 0.3s ease;
  }
  .gh-link:hover { transform: translateY(3px); }
  .gh-arrow { font-size: 1.9rem; line-height: 1; animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
  .gh-label { font-size: 0.9rem; letter-spacing: 0.3em; text-indent: 0.3em; }
  .restart-link {
    font-size: 0.8rem; letter-spacing: 0.2em; color: var(--ink-soft);
    text-decoration: none; cursor: pointer; opacity: 0.85;
  }
  .restart-link:hover { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    #enter { animation: none; }
    .story { animation: none; }
    .cursor { animation: blink 1.05s step-end infinite; }
  }
</style>
</head>
<body>

  <!-- 进入门：音频需用户手势才能启动 -->
  <div id="gate">
    <h1 class="title">知行旅人</h1>
    <div class="sub">一程关于「知」与「行」的故事</div>
    <button id="enter">点 击 进 入</button>
    <div class="hint">建议佩戴耳机 · 含键盘声与背景音乐</div>
  </div>

  <!-- 叙事舞台 -->
  <main id="stage">
    <div class="story" id="story" aria-live="polite"></div>
    <div class="the-end" id="theEnd">
      <a class="gh-link" href="https://github.com/zhixinglvren" target="_blank" rel="noopener" aria-label="进入 GitHub 主页">
        <span class="gh-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 17 L4 7 H20 Z"/></svg>
        </span>
        <span class="gh-label">进入 GitHub</span>
      </a>
      <a class="restart-link" id="restartBtn">↻ 重新讲述</a>
    </div>
  </main>

  <div class="controls" id="controls" style="display:none">
    <button id="muteBtn" title="静音 / 取消静音" aria-label="静音">🔊</button>
    <button id="skipBtn" title="跳过打字，直接显示全文" aria-label="跳过">⏭</button>
  </div>

<script>
(function () {
  "use strict";

  /* ===== 故事文本（关于「知行旅人」，不含个人信息） ===== */
  var STORY = [
    "世间本没有路。",
    "直到第一个旅人，抬起脚。",
    "",
    "他称自己为「知行旅人」。",
    "知，是手里的一盏灯；行，是脚下没有尽头的长路。",
    "灯若不亮，路便隐在黑暗里；",
    "路若不走，灯也不过是握紧的虚无。",
    "",
    "他走过许多地方——",
    "见过会思考的机器，见过沉默的数据海，",
    "也见过人在代码与尘世之间，反复地醒来。",
    "",
    "他从不说从哪里来，也不说要到哪里去。",
    "只把路上看见的，一个字、一个字，写进风里。",
    "若你听见键盘的声响，那便是他在说话。",
    "",
    "你来了。",
    "那么，故事，就开始了。"
  ];

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===== 音频引擎（Web Audio 程序化生成） ===== */
  var actx = null, master = null, musicBus = null, keyGain = null, noiseBuf = null, started = false, muted = false;
  var MUSIC_VOL = 0.13;

  function makeImpulse(dur, decay) {
    var len = Math.floor(actx.sampleRate * dur);
    var buf = actx.createBuffer(2, len, actx.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function initAudio() {
    if (started) return;
    started = true;
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    if (actx.state === 'suspended') actx.resume();

    // 总开关（受静音控制，满增益让键盘声清晰）
    master = actx.createGain();
    master.gain.value = 1;
    master.connect(actx.destination);

    // 混响（空间感）
    var conv = actx.createConvolver();
    conv.buffer = makeImpulse(2.8, 2.8);
    var wet = actx.createGain(); wet.gain.value = 0.55;
    conv.connect(wet); wet.connect(master);
    var dry = actx.createGain(); dry.gain.value = 0.75;
    dry.connect(master);

    // 音乐总线（受背景音量控制）
    musicBus = actx.createGain();
    musicBus.gain.value = MUSIC_VOL;
    musicBus.connect(dry);
    musicBus.connect(conv);

    // 键盘声总线（保持清脆，不经混响，不被音乐音量压低）
    keyGain = actx.createGain();
    keyGain.gain.value = 1;
    keyGain.connect(master);

    // 低沉铺底 drone（羽调根音 A，余韵悠长）
    var droneGain = actx.createGain(); droneGain.gain.value = 0.30; droneGain.connect(musicBus);
    var lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 360; lp.connect(droneGain);
    [55, 82.5, 110].forEach(function (f, i) {
      var o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.detune.value = (i - 1) * 4;
      o.connect(lp); o.start();
    });
    var lfo = actx.createOscillator(); lfo.frequency.value = 0.06;
    var lfoG = actx.createGain(); lfoG.gain.value = 110;
    lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();

    // 缓慢歌唱的旋律（五声音阶 / 羽调，似古琴的绰注）
    var melody = [220, 196, 164.81, 146.83, 130.81, 146.83, 164.81, 196, 220, 164.81, 146.83, 130.81];
    var mIndex = 0;
    function tone(freq, dur, vol) {
      var o = actx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
      var o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2; // 泛音
      var g = actx.createGain(); g.gain.value = 0;
      var g2 = actx.createGain(); g2.gain.value = 0;
      o.connect(g); o2.connect(g2); g.connect(musicBus); g2.connect(musicBus);
      var t = actx.currentTime;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.14);
      g.gain.exponentialRampToValueAtTime(0.0006, t + dur);
      g2.gain.setValueAtTime(0, t);
      g2.gain.linearRampToValueAtTime(vol * 0.22, t + 0.14);
      g2.gain.exponentialRampToValueAtTime(0.0004, t + dur);
      o.start(t); o.stop(t + dur + 0.1);
      o2.start(t); o2.stop(t + dur + 0.1);
    }
    function melodyStep() {
      if (!started) return;
      tone(melody[mIndex % melody.length], 2.4 + Math.random() * 1.2, 0.20);
      mIndex++;
      setTimeout(melodyStep, 1600 + Math.random() * 1100);
    }
    setTimeout(melodyStep, 1500);

    // 古寺钟声（低频长鸣，哲学 / 禅意）
    function bell() {
      if (!started) return;
      var t = actx.currentTime, base = 55;
      [[1, 0.16], [2, 0.09], [3, 0.05], [4, 0.03]].forEach(function (p) {
        var o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = base * p[0];
        var g = actx.createGain(); g.gain.value = 0;
        o.connect(g); g.connect(conv); g.connect(musicBus);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(p[1], t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0004, t + 7);
        o.start(t); o.stop(t + 7.2);
      });
      setTimeout(bell, 15000 + Math.random() * 7000);
    }
    setTimeout(bell, 9000);

    // 键盘敲击声用的噪声缓冲
    noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.05), actx.sampleRate);
    var nd = noiseBuf.getChannelData(0);
    for (var k = 0; k < nd.length; k++) nd[k] = Math.random() * 2 - 1;
  }

  function playKey() {
    if (!actx || muted) return;
    var src = actx.createBufferSource(); src.buffer = noiseBuf;
    var bp = actx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 1700 + Math.random() * 1200; bp.Q.value = 1.1;
    var g = actx.createGain(); g.gain.value = 0;
    var t = actx.currentTime;
    src.connect(bp); bp.connect(g); g.connect(keyGain);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.14, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.08);
    src.start(t); src.stop(t + 0.09);
  }

  /* ===== 打字引擎 ===== */
  var storyEl = document.getElementById('story');
  var cursor = document.createElement('span');
  cursor.className = 'cursor'; cursor.setAttribute('aria-hidden', 'true');

  var pIndex = 0, cIndex = 0, timer = null, currentP = null, finished = false;

  function newParagraph() {
    currentP = document.createElement('p');
    if (STORY[pIndex] === "") currentP.className = 'blank';
    storyEl.appendChild(currentP);
  }

  function typeParagraph() {
    if (finished) return;
    var text = STORY[pIndex];
    if (cIndex < text.length) {
      var ch = text[cIndex];
      currentP.appendChild(document.createTextNode(ch));
      currentP.appendChild(cursor);
      if (ch.trim() !== '') playKey();
      cIndex++;
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'auto' });
      var delay = (reduceMotion ? 18 : 55) + Math.random() * (reduceMotion ? 12 : 45);
      if ('。！？'.indexOf(ch) >= 0) delay = reduceMotion ? 120 : 520;
      else if ('，、；：'.indexOf(ch) >= 0) delay = reduceMotion ? 60 : 240;
      timer = setTimeout(typeParagraph, delay);
    } else {
      pIndex++; cIndex = 0;
      if (pIndex >= STORY.length) { finish(); return; }
      timer = setTimeout(function () { newParagraph(); typeParagraph(); }, reduceMotion ? 120 : 440);
    }
  }

  function startStory() {
    storyEl.innerHTML = '';
    pIndex = 0; cIndex = 0; finished = false;
    document.getElementById('theEnd').classList.remove('show');
    newParagraph();
    typeParagraph();
  }

  function finish() {
    finished = true;
    // 光标继续闪烁，显示「重新讲述」
    setTimeout(function () { document.getElementById('theEnd').classList.add('show'); }, 900);
  }

  function skip() {
    if (finished) return;
    if (timer) clearTimeout(timer);
    finished = true;
    storyEl.innerHTML = '';
    STORY.forEach(function (line) {
      var p = document.createElement('p');
      if (line === '') p.className = 'blank';
      p.textContent = line;
      storyEl.appendChild(p);
    });
    storyEl.appendChild(cursor);
    document.getElementById('theEnd').classList.add('show');
  }

  /* ===== 交互绑定 ===== */
  var gate = document.getElementById('gate');
  var stage = document.getElementById('stage');
  var controls = document.getElementById('controls');

  document.getElementById('enter').addEventListener('click', function () {
    try { initAudio(); } catch (e) { console.warn('audio init failed:', e); }
    gate.classList.add('hidden');
    stage.classList.add('show');
    controls.style.display = 'flex';
    startStory();
  });

  document.getElementById('skipBtn').addEventListener('click', skip);
  document.getElementById('restartBtn').addEventListener('click', startStory);

  document.getElementById('muteBtn').addEventListener('click', function () {
    if (!master) return;
    muted = !muted;
    var t = actx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(muted ? 0 : 1, t + 0.4);
    this.textContent = muted ? '🔇' : '🔊';
  });
})();
</script>
</body>
</html>
